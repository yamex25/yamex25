<!DOCTYPE html>
<html>
<head>
    <title>Logged out — ERP Decision Guide</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #eef2ff;
            color: #0f172a;
        }
        .page {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        }
        h1 {
            margin: 0 0 14px;
            font-size: 2rem;
            color: #1d4ed8;
        }
        p {
            margin: 0 0 24px;
            line-height: 1.7;
            color: #475569;
        }
        a {
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <h1>Logged out</h1>
        <p>You have safely logged out of the ERP decision guide.</p>
        <p><a href="{% url 'login' %}">Login again</a> · <a href="{% url 'index' %}">Return home</a></p>
    </div>
</div>
</body>
</html>
